<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mausam — Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="weather-app">
    <div class="search-box">
      <input type="text" id="city-input" placeholder="Enter city name (e.g. Karachi, London)" />
      <button id="search-btn">🔍</button>
    </div>

    <!-- Error Message -->
    <div id="error-msg" class="hidden">City not found. Please check the spelling.</div>

    <!-- Weather Card -->
    <div class="weather-card hidden" id="weather-card">
      <h2 id="city-name">City Name</h2>
      
      <!-- Weather Emoji Icon -->
      <div class="weather-icon" id="icon">☀️</div>
      
      <h1 id="temp">0°C</h1>
      <p id="description">Clear Sky</p>

      <div class="details">
        <div class="detail-box">
          <span id="humidity">0%</span>
          <p>Humidity</p>
        </div>
        <div class="detail-box">
          <span id="wind">0 km/h</span>
          <p>Wind Speed</p>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
